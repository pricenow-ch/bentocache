name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for an upstream sync
        type: string
        default: ''
    outputs:
      results:
        description: CI job results for upstream sync validation
        value: ${{ jobs.collect-results.outputs.results }}
      passed:
        description: All upstream sync CI jobs succeeded
        value: ${{ jobs.collect-results.outputs.passed }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C packages/bentocache build

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6380:6379
      dynamodb:
        image: amazon/dynamodb-local:2.6.1
        ports:
          - 8000:8000
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mysql
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: Run tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          VALKEY_HOST: localhost
          VALKEY_PORT: 6380
          FORCE_COLOR: 1
        run: pnpm test

  upstream-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test upstream sync automation
        run: node --test .github/scripts/upstream_sync.spec.mjs

  collect-results:
    needs: [lint, typecheck, build, tests, upstream-sync-tests]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.collect.outputs.results }}
      passed: ${{ steps.collect.outputs.passed }}
    steps:
      - name: Collect CI results
        id: collect
        uses: actions/github-script@v7
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.CI_RESULTS)
            const results = Object.fromEntries(Object.entries(needs).map(([name, job]) => [name, job.result]))
            core.setOutput('results', JSON.stringify(results))
            core.setOutput('passed', Object.values(results).every((result) => result === 'success'))
