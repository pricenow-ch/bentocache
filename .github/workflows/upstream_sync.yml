name: Upstream sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'pricenow-ch/bentocache'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    outputs:
      plan: ${{ steps.prepare.outputs.plan }}
      ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare upstream sync PR
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const { prepareSync } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upstream_sync.mjs`)
            const plan = await prepareSync({
              github,
              core,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              sleep: (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
            })
            core.setOutput('plan', JSON.stringify(plan))
            core.setOutput('ready', plan !== null)

  ci:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ fromJSON(needs.prepare.outputs.plan).merge }}

  report:
    needs: [prepare, ci]
    if: always() && needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      passed: ${{ steps.report.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report upstream sync CI results
        id: report
        uses: actions/github-script@v7
        env:
          SYNC_CHECK_RUNS: ${{ toJSON(fromJSON(needs.prepare.outputs.plan).checks) }}
          SYNC_RESULTS: ${{ needs.ci.outputs.results || '{}' }}
        with:
          script: |
            const { reportChecks } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upstream_sync.mjs`)
            const passed = await reportChecks({
              github,
              checks: JSON.parse(process.env.SYNC_CHECK_RUNS),
              results: JSON.parse(process.env.SYNC_RESULTS),
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('passed', passed)

  merge:
    needs: [prepare, ci, report]
    if: needs.ci.result == 'success' && needs.report.outputs.passed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Merge validated sync PR
        uses: actions/github-script@v7
        env:
          SYNC_PLAN: ${{ needs.prepare.outputs.plan }}
        with:
          script: |
            const { mergeSync } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upstream_sync.mjs`)
            await mergeSync({
              github,
              core,
              plan: JSON.parse(process.env.SYNC_PLAN),
              sleep: (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
            })
