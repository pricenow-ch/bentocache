name: Publish @pricenow/bentocache

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in packages/bentocache/package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pricenow-bentocache
  cancel-in-progress: false

jobs:
  check-version:
    if: github.repository == 'pricenow-ch/bentocache' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Check requested version
        id: version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const manifest = JSON.parse(fs.readFileSync('packages/bentocache/package.json', 'utf8'))
          assert.equal(manifest.name, '@pricenow/bentocache')
          assert.equal(manifest.version, process.env.EXPECTED_VERSION)
          assert.equal(manifest.publishConfig.access, 'public')
          assert.notEqual(manifest.publishConfig.provenance, false)
          const prerelease = manifest.version.split('+')[0].match(/^\d+\.\d+\.\d+-(.+)$/)?.[1]
          const npmTag = prerelease?.split('.')[0] ?? 'latest'
          assert.match(npmTag, /^[a-z][a-z0-9-]*$/i)
          if (prerelease) assert.notEqual(npmTag, 'latest')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${npmTag}\nprerelease=${Boolean(prerelease)}\n`)
          NODE

  validate:
    needs: check-version
    uses: ./.github/workflows/checks.yml

  publish:
    needs: [check-version, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Install release tools
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          npm install --global npm@11
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, pack, and verify
        run: |
          pnpm release:pack
          pnpm release:verify
      - name: Publish exact version using npm trusted publishing
        env:
          NPM_TAG: ${{ needs.check-version.outputs.npm-tag }}
        run: npm publish ./dist/bentocache.tgz --access public --provenance --tag "$NPM_TAG"
      - name: Record GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          release_flags=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "@pricenow/bentocache@${RELEASE_VERSION}" \
            --target "$GITHUB_SHA" \
            --title "@pricenow/bentocache@${RELEASE_VERSION}" \
            --generate-notes "${release_flags[@]}"
